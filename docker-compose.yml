version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: steelmetrics-db
    environment:
      POSTGRES_DB: ${DB_NAME:-steelmetrics}
      POSTGRES_USER: ${DB_USER:-steelmetrics_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "127.0.0.1:5432:5432"  # فقط از localhost قابل دسترسی
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - steelmetrics-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-steelmetrics_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: steelmetrics-backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=5000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-steelmetrics}
      - DB_USER=${DB_USER:-steelmetrics_user}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://steelmetrics.ir}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:5000:5000"  # فقط از localhost قابل دسترسی
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - steelmetrics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: steelmetrics-frontend
    environment:
      - VITE_API_URL=${API_URL:-http://localhost:5000/api}
    ports:
      - "127.0.0.1:3000:3000"  # فقط از localhost قابل دسترسی
    depends_on:
      - backend
    networks:
      - steelmetrics-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: steelmetrics-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - steelmetrics-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  steelmetrics-network:
    driver: bridge
